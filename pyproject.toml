[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-billing-cdi-engine"
version = "2.1.0"
description = "Deterministic clinical documentation workflow prototype with CLI, API, CSV processing, and a browser demo"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.111,<1",
    "pydantic>=2.7,<3",
    "uvicorn>=0.30,<1",
]
test = [
    "pytest>=8,<10",
    "pydantic>=2.7,<3",
]

[project.scripts]
clinical-billing-cdi-engine = "clinical_billing_cdi_agent.cli:main"

[project.urls]
Homepage = "https://abusuraihsakhri.github.io/clinical-billing-cdi-agent/"
Repository = "https://github.com/abusuraihsakhri/clinical-billing-cdi-agent"

[tool.setuptools]
packages = ["clinical_billing_cdi_agent", "agents"]
py-modules = [
    "cdi_sentinel",
    "cdi_sentinel_app",
    "clinical_billing_cdi_agent_app",
    "cli",
    "enrichment",
    "simulator",
]
